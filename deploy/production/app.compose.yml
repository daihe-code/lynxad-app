name: lynxad-app

services:
  app-api:
    image: lynxad-prod-acr-registry-vpc.cn-beijing.cr.aliyuncs.com/lynxad-prod/lynxad-app-api:20261021-review-product-suggestions
    env_file: ${LYNXAD_ENV_FILE:-./production.env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/lynx-ad/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  app-web:
    image: lynxad-prod-acr-registry-vpc.cn-beijing.cr.aliyuncs.com/lynxad-prod/lynxad-app-web:20261021-review-product-suggestions
    ports:
      - "80:80"
    depends_on:
      app-api:
        condition: service_healthy
      engine-console:
        condition: service_healthy
    restart: unless-stopped

  engine-console:
    image: lynxad-prod-acr-registry-vpc.cn-beijing.cr.aliyuncs.com/lynxad-prod/lynxad-app-web:20261016-seedream-console
    env_file: ./engine-console.env
    restart: unless-stopped
    read_only: true
    user: node
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/__console/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
