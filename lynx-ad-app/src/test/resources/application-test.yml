spring:
  task:
    scheduling:
      enabled: false
  datasource:
    hikari:
      maximum-pool-size: 2

lynx:
  ad:
    db:
      # 与容器注入的 PostgreSQL URL 使用同一个开关，不另写一套数据源覆盖。
      vendor: postgresql
    mock:
      qianchuan: true
      ai: true
      auto-audit: PASS
    sms:
      mode: mock
      dev-code: "123456"
      ttl-sec: 300
      cooldown-sec: 0
      live:
        vendor: ""
        endpoint: ""
        access-key: ""
        access-secret: ""
        sign-name: ""
        template-code: ""
    contact:
      phone: "400-000-0000"
      email: "hello@example.com"
      ops-phones: ""
    jwt:
      secret: "dev-only-change-me-32bytes-min-key!!"
    crypto:
      aes-key: "dev-only-aes256-key-32bytes!!!!"
    oauth:
      web-callback-uri: http://localhost:5173/oauth/callback
      qianchuan:
        redirect-uri: http://localhost:8080/lynx-ad/api/v1/identity/oauth/callback
        authorize-url: https://qianchuan.jinritemai.com/openapi/qc/audit/oauth.html
    demo-mode: true
    money:
      stat-cost-divisor: 100000
    payment:
      mode: mock
      timezone: Asia/Shanghai
      wechat:
        app-id: ""
        mch-id: ""
        api-v3-key: ""
        serial-no: ""
        private-key-pem: ""
        notify-url: ""
    storage:
      mode: local
      local-dir: ${java.io.tmpdir}/lynx-ad-test-storage
      url-ttl-sec: 3600
      oss:
        endpoint: ""
        bucket: ""
        region: ""
        prefix: lynx-ad/
        access-key-id: ""
        access-key-secret: ""
    qianchuan:
      video-get-url: https://ad.oceanengine.com/open_api/v1.0/qianchuan/video/get/
      image-get-url: https://ad.oceanengine.com/open_api/v1.0/qianchuan/image/get/
      carousel-get-url: https://api.oceanengine.com/open_api/v1.0/qianchuan/carousel/get/
      oauth:
        access-token-url: https://api.oceanengine.com/open_api/oauth2/access_token/
        refresh-token-url: https://ad.oceanengine.com/open_api/oauth2/refresh_token/
        advertiser-get-url: https://api.oceanengine.com/open_api/oauth2/advertiser/get/
        aweme-authorized-url: https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_aweme/authorized/get/
        aweme-relations-url: https://api.oceanengine.com/open_api/v1.0/qianchuan/overall_aweme/list/
      catalog:
        product-get-url: https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_promotion/product/get/
      delivery:
        suggest-budget-url: https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_aweme/suggest/budget/
        suggest-roi-url: https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_aweme/suggest/roi/
        ad-create-url: https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_aweme/ad/create/
        ad-update-url: https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_aweme/ad/update/
        ad-list-url: https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_promotion/list/
        ad-status-url: https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_promotion/ad/status/update/
      report:
        custom-url: https://api.oceanengine.com/open_api/v1.0/qianchuan/report/uni_promotion/data/get/
      material:
        video-upload-url: https://ad.oceanengine.com/open_api/2/file/video/ad/
    ai:
      llm:
        base-url: ""
        api-key: ""
        model: ""
        timeout-ms: 60000
      tts:
        base-url: ""
        api-key: ""
        timeout-ms: 60000
      keling:
        endpoint: ""
        access-key: ""
        secret: ""
        poll-ms: 2000
        max-poll: 150
