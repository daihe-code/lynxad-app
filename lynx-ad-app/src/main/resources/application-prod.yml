lynx:
  ad:
    mock:
      qianchuan: false
      ai: false
    sms:
      mode: ${LYNX_SMS_MODE:live}
      dev-code: ${LYNX_SMS_DEV_CODE:123456}
      ttl-sec: 300
      cooldown-sec: 90
      live:
        vendor: ${SMS_VENDOR:}
        endpoint: ${SMS_ENDPOINT:}
        access-key: ${SMS_ACCESS_KEY:}
        access-secret: ${SMS_ACCESS_SECRET:}
        sign-name: ${SMS_SIGN_NAME:}
        template-code: ${SMS_TEMPLATE_CODE:}
    contact:
      phone: ${LYNX_CONTACT_PHONE:}
      email: ${LYNX_CONTACT_EMAIL:}
      ops-phones: ${LYNX_CONTACT_OPS_PHONES:}
    jwt:
      secret: ${LYNX_JWT_SECRET}
    crypto:
      aes-key: ${LYNX_AES_KEY}
    oauth:
      web-callback-uri: ${LYNX_OAUTH_WEB_CALLBACK_URI}
      qianchuan:
        mode: ${QIANCHUAN_OAUTH_MODE:live}
        app-id: ${QIANCHUAN_APPID}
        app-secret: ${QIANCHUAN_SECRET}
        redirect-uri: ${QIANCHUAN_REDIRECT_URI}
        authorize-url: ${QIANCHUAN_AUTHORIZE_URL:https://qianchuan.jinritemai.com/openapi/qc/audit/oauth.html}
    demo-mode: false
    payment:
      mode: ${LYNX_PAYMENT_MODE:mock}
      timezone: Asia/Shanghai
      wechat:
        app-id: ${WECHAT_PAY_APP_ID:}
        mch-id: ${WECHAT_PAY_MCH_ID:}
        api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
        serial-no: ${WECHAT_PAY_SERIAL_NO:}
        private-key-pem: ${WECHAT_PAY_PRIVATE_KEY_PEM:}
        notify-url: ${WECHAT_PAY_NOTIFY_URL:}
    storage:
      asset-mode: ${LYNX_ASSET_STORAGE_MODE:oss}
      direct-upload-enabled: ${LYNX_OSS_DIRECT_UPLOAD_ENABLED:false}
      ffmpeg-path: ${LYNX_FFMPEG_PATH:ffmpeg}
      media-validation-timeout-sec: 180
      mode: ${LYNX_STORAGE_MODE:oss}
      local-dir: ${LYNX_STORAGE_LOCAL_DIR:./data/storage}
      url-ttl-sec: 3600
      oss:
        endpoint: ${OSS_ENDPOINT:}
        bucket: ${OSS_BUCKET:}
        image-bucket: ${OSS_IMAGE_BUCKET:lynxad-douyin-image}
        voice-bucket: ${OSS_VOICE_BUCKET:lynxad-douyin-voice}
        video-bucket: ${OSS_VIDEO_BUCKET:lynxad-douyin-video}
        region: ${OSS_REGION:}
        prefix: ${OSS_PREFIX:lynx-ad/}
        access-key-id: ${OSS_ACCESS_KEY_ID:}
        access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    qianchuan:
      video-get-url: ${QC_VIDEO_GET_URL:https://ad.oceanengine.com/open_api/v1.0/qianchuan/video/get/}
      image-get-url: ${QC_IMAGE_GET_URL:https://ad.oceanengine.com/open_api/v1.0/qianchuan/image/get/}
      carousel-get-url: ${QC_CAROUSEL_GET_URL:https://api.oceanengine.com/open_api/v1.0/qianchuan/carousel/get/}
      oauth:
        access-token-url: ${QC_ACCESS_TOKEN_URL:https://api.oceanengine.com/open_api/oauth2/access_token/}
        refresh-token-url: ${QC_REFRESH_TOKEN_URL:https://ad.oceanengine.com/open_api/oauth2/refresh_token/}
        advertiser-get-url: ${QC_ADVERTISER_GET_URL:https://api.oceanengine.com/open_api/oauth2/advertiser/get/}
        aweme-authorized-url: ${QC_AWEME_AUTHORIZED_URL:https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_aweme/authorized/get/}
        aweme-relations-url: ${QC_AWEME_RELATIONS_URL:https://api.oceanengine.com/open_api/v1.0/qianchuan/overall_aweme/list/}
      catalog:
        product-get-url: ${QC_PRODUCT_GET_URL:https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_promotion/product/get/}
        product-price-url: ${QC_PRODUCT_PRICE_URL:https://api.oceanengine.com/open_api/v1.0/qianchuan/product/available/get/}
        price-cache-seconds: ${QC_PRODUCT_PRICE_CACHE_SECONDS:600}
      delivery:
        suggest-budget-url: ${QC_SUGGEST_BUDGET_URL:https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_aweme/suggest/budget/}
        suggest-roi-url: ${QC_SUGGEST_ROI_URL:https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_aweme/suggest/roi/}
        ad-create-url: ${QC_AD_CREATE_URL:https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_aweme/ad/create/}
        ad-update-url: ${QC_AD_UPDATE_URL:https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_aweme/ad/update/}
        ad-budget-update-url: ${QC_AD_BUDGET_UPDATE_URL:https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_promotion/ad/budget/update/}
        ad-roi-update-url: ${QC_AD_ROI_UPDATE_URL:https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_promotion/ad/roi2_goal/update/}
        ad-list-url: ${QC_AD_LIST_URL:https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_promotion/list/}
        ad-status-url: ${QC_AD_STATUS_URL:https://api.oceanengine.com/open_api/v1.0/qianchuan/uni_promotion/ad/status/update/}
      report:
        custom-url: ${QC_REPORT_CUSTOM_URL:https://api.oceanengine.com/open_api/v1.0/qianchuan/report/uni_promotion/data/get/}
      material:
        video-upload-url: ${QC_VIDEO_UPLOAD_URL:https://api.oceanengine.com/open_api/2/file/video/ad/}
        image-upload-url: ${QC_IMAGE_UPLOAD_URL:https://api.oceanengine.com/open_api/2/file/image/ad/}
        audio-upload-url: ${QC_AUDIO_UPLOAD_URL:https://api.oceanengine.com/open_api/2/file/audio/ad/}
    ai:
      review:
        base-url: ${LYNX_AI_ENGINE_BASE_URL:}
        media-base-url: ${LYNX_AI_REVIEW_MEDIA_BASE_URL:}
        timeout-ms: 180000
      llm:
        base-url: ${LLM_BASE_URL:}
        api-key: ${LLM_API_KEY:}
        model: ${LLM_MODEL:}
        timeout-ms: 60000
      tts:
        base-url: ${TTS_BASE_URL:}
        api-key: ${TTS_API_KEY:}
        timeout-ms: 60000
      keling:
        endpoint: ${KELING_ENDPOINT:}
        access-key: ${KELING_ACCESS_KEY:}
        secret: ${KELING_SECRET:}
        poll-ms: 2000
        max-poll: 150
