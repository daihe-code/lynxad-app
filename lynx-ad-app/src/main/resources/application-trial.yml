spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      password: ${SPRING_DATA_REDIS_PASSWORD}

lynx:
  ad:
    demo-mode: true
    mock:
      qianchuan: true
      ai: true
    sms:
      mode: mock
    payment:
      mode: mock
    storage:
      mode: local
      local-dir: ${LYNX_STORAGE_LOCAL_DIR}
    jwt:
      secret: ${LYNX_JWT_SECRET}
    crypto:
      aes-key: ${LYNX_AES_KEY}
    oauth:
      web-callback-uri: ${LYNX_OAUTH_WEB_CALLBACK_URI}
      qianchuan:
        app-id: ${QIANCHUAN_APPID:}
        app-secret: ${QIANCHUAN_SECRET:}
        redirect-uri: ${QIANCHUAN_REDIRECT_URI}
