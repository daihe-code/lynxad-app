server:
  servlet:
    context-path: /lynx-ad
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 501MB
      file-size-threshold: 0
  application:
    name: lynx-ad-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_UUID

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# 业务库只由 lynx.ad.db.vendor 决定，取值 mysql 或 postgresql，缺省 mysql。
# 开发、试用、正式共用这棵树。本机 dev 用字面量覆盖两枝连接。
lynx:
  ad:
    db:
      vendor: ${LYNX_DB_VENDOR:mysql}
      mysql:
        url: ${LYNX_DB_MYSQL_URL:${SPRING_DATASOURCE_URL:}}
        username: ${LYNX_DB_MYSQL_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
        password: ${LYNX_DB_MYSQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
      postgresql:
        url: ${LYNX_DB_POSTGRESQL_URL:${SPRING_DATASOURCE_URL:}}
        username: ${LYNX_DB_POSTGRESQL_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
        password: ${LYNX_DB_POSTGRESQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
