server:
  servlet:
    context-path: /lynx-ad
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1001MB
      file-size-threshold: 0
  application:
    name: lynx-ad-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_UUID

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# 业务库只由 lynx.ad.db.vendor 决定，取值 mysql 或 postgresql，缺省 mysql。
# 开发、试用、正式共用这棵树。本机 dev 用字面量覆盖两枝连接。
lynx:
  ad:
    payment:
      alipay:
        gateway: ${ALIPAY_GATEWAY:https://openapi.alipay.com/gateway.do}
        app-id: ${ALIPAY_APP_ID:}
        seller-id: ${ALIPAY_SELLER_ID:}
        private-key: ${ALIPAY_PRIVATE_KEY:}
        public-key: ${ALIPAY_PUBLIC_KEY:}
        app-cert-path: ${ALIPAY_APP_CERT_PATH:}
        alipay-cert-path: ${ALIPAY_PUBLIC_CERT_PATH:}
        root-cert-path: ${ALIPAY_ROOT_CERT_PATH:}
        notify-url: ${ALIPAY_NOTIFY_URL:}
        return-origin: ${ALIPAY_RETURN_ORIGIN:}
    workspace-pricing:
      enabled: ${LYNXAD_WORKSPACE_PRICING_ENABLED:true}
    monitoring:
      api-key: ${LYNXAD_MONITORING_API_KEY:}
      engine-api-key: ${LYNXAD_ENGINE_API_KEY:}
      scan-ms: 10000
    remake-link:
      # 抖音链接导入：先试 H5 路由（服务端常被 Argus 拦截），再试详情接口与备用接口；备用接口为空时不启用。
      # 备用接口为自托管的 Evil0ctal Douyin_TikTok_Download_API 实例，
      # download-api-path 按实例版本填写（见实例的 /docs）。
      download-api-base-url: ${LYNXAD_REMAKE_LINK_DOWNLOAD_API_BASE_URL:}
      download-api-path: ${LYNXAD_REMAKE_LINK_DOWNLOAD_API_PATH:}
      download-api-key: ${LYNXAD_REMAKE_LINK_DOWNLOAD_API_KEY:}
      ffprobe-path: ${LYNXAD_FFPROBE_PATH:ffprobe}
    db:
      vendor: ${LYNX_DB_VENDOR:mysql}
      mysql:
        url: ${LYNX_DB_MYSQL_URL:${SPRING_DATASOURCE_URL:}}
        username: ${LYNX_DB_MYSQL_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
        password: ${LYNX_DB_MYSQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
      postgresql:
        url: ${LYNX_DB_POSTGRESQL_URL:${SPRING_DATASOURCE_URL:}}
        username: ${LYNX_DB_POSTGRESQL_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
        password: ${LYNX_DB_POSTGRESQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
